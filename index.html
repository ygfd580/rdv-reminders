<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenRemind</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* AUTH */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, rgba(139, 92, 246, 0.1), transparent 65%);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #c4b5fd, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--border);
      color: var(--text);
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: var(--muted);
    }

    .auth-footer span {
      color: #a78bfa;
      cursor: pointer;
      font-weight: 600;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
    }

    /* APP */
    #app { display: none; }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
    }

    .greeting h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .greeting p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .stat strong { color: var(--text); }

    .create-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
    }

    .create-box h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .group { margin-bottom: 28px; }

    .group-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      margin-bottom: 10px;
    }

    .card:hover { border-color: #3f3f46; }

    .card.today {
      border-color: rgba(139, 92, 246, 0.45);
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.07), transparent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-weight: 600;
      font-size: 15px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .card-notes {
      margin-top: 10px;
      font-size: 14px;
      color: #d4d4d8;
      white-space: pre-wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
    }

    .badge.weekly {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: #27272a;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      background: #3f3f46;
      color: var(--text);
    }

    .icon-btn.done:hover {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .icon-btn.delete:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    .empty p {
      margin-top: 10px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- AUTH -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo">ZenRemind</div>
      <p class="auth-subtitle">Tes rendez-vous, simplement</p>

      <div id="message" class="message"></div>

      <form id="auth-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="toi@exemple.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="password" required minlength="6" placeholder="Minimum 6 caractères" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="auth-btn">Se connecter</button>
      </form>

      <div class="auth-footer">
        <span id="toggle-auth">Pas encore de compte ? Créer un compte</span>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="container">
      <header>
        <div class="greeting">
          <h1 id="greeting-text">Bonjour</h1>
          <p id="user-email"></p>
        </div>
        <div class="user-area">
          <div class="avatar" id="avatar">?</div>
          <button class="btn btn-ghost" style="width:auto;padding:7px 12px;font-size:13px" id="logout-btn">Déconnexion</button>
        </div>
      </header>

      <div class="stats">
        <div class="stat">Aujourd'hui <strong id="stat-today">0</strong></div>
        <div class="stat">À venir <strong id="stat-total">0</strong></div>
      </div>

      <div class="create-box">
        <h2>Nouveau rendez-vous</h2>
        <form id="reminder-form">
          <div class="field">
            <label>Titre</label>
            <input type="text" id="title" required maxlength="120" placeholder="Ex : Dentiste, Réunion...">
          </div>
          <div class="field">
            <label>Notes (optionnel)</label>
            <textarea id="notes" placeholder="Adresse, détails..."></textarea>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Date</label>
              <input type="date" id="date" required>
            </div>
            <div class="field">
              <label>Heure</label>
              <input type="time" id="time" required>
            </div>
          </div>
          <div class="field">
            <label>Répétition</label>
            <select id="recurrence">
              <option value="none">Une seule fois</option>
              <option value="weekly">Chaque semaine</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" id="create-btn">Ajouter</button>
        </form>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        Chargement...
      </div>
      <div id="list"></div>
      <div id="empty" class="empty" style="display:none">
        <div style="font-size:36px;opacity:0.35">📅</div>
        <p>Aucun rendez-vous.<br>Crée-en un ci-dessus.</p>
      </div>
    </div>
  </div>

  <script>
    // ====================== CONFIG ======================
    const SUPABASE_URL = 'https://kbyansbadnpbfmehdvui.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtieWFuc2JhZG5wYmZtZWhkdnVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDcxMjksImV4cCI6MjEwMzUyMzEyOX0.nJTxqvGlesGtmMxpldnvq3gktt416CdH1aRu8KVSATE';

    // Correction du conflit de nom
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ====================== STATE ======================
    let isLoginMode = true;
    let currentUser = null;
    let reminders = [];

    // ====================== DOM ======================
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app');
    const authForm = document.getElementById('auth-form');
    const authBtn = document.getElementById('auth-btn');
    const toggleAuth = document.getElementById('toggle-auth');
    const messageEl = document.getElementById('message');
    const reminderForm = document.getElementById('reminder-form');
    const createBtn = document.getElementById('create-btn');
    const listEl = document.getElementById('list');
    const loadingEl = document.getElementById('loading');
    const emptyEl = document.getElementById('empty');
    const logoutBtn = document.getElementById('logout-btn');
    const avatarEl = document.getElementById('avatar');
    const greetingText = document.getElementById('greeting-text');
    const userEmailEl = document.getElementById('user-email');

    // ====================== AUTH ======================
    toggleAuth.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      authBtn.textContent = isLoginMode ? 'Se connecter' : 'Créer un compte';
      toggleAuth.textContent = isLoginMode
        ? 'Pas encore de compte ? Créer un compte'
        : 'Déjà un compte ? Se connecter';
      hideMessage();
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      authBtn.disabled = true;
      authBtn.textContent = 'Chargement...';

      try {
        let result;
        if (isLoginMode) {
          result = await client.auth.signInWithPassword({ email, password });
        } else {
          result = await client.auth.signUp({ email, password });
        }

        if (result.error) throw result.error;

        if (!isLoginMode && !result.data.session) {
          showMessage('Compte créé avec succès ! Tu peux maintenant te connecter.', 'success');
          isLoginMode = true;
          authBtn.textContent = 'Se connecter';
          toggleAuth.textContent = 'Pas encore de compte ? Créer un compte';
          document.getElementById('password').value = '';
        }
      } catch (err) {
        showMessage(err.message || 'Une erreur est survenue', 'error');
      } finally {
        authBtn.disabled = false;
        authBtn.textContent = isLoginMode ? 'Se connecter' : 'Créer un compte';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await client.auth.signOut();
    });

    client.auth.onAuthStateChange((_event, session) => {
      if (session && session.user) {
        currentUser = session.user;
        showApp();
        loadReminders();
        requestNotifPermission();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    function showApp() {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      avatarEl.textContent = (currentUser.email || 'U')[0].toUpperCase();
      userEmailEl.textContent = currentUser.email;
      setGreeting();
    }

    function showAuth() {
      appScreen.style.display = 'none';
      authScreen.style.display = 'flex';
    }

    function setGreeting() {
      const hour = new Date().getHours();
      if (hour >= 18) greetingText.textContent = 'Bonsoir';
      else if (hour >= 12) greetingText.textContent = 'Bon après-midi';
      else greetingText.textContent = 'Bonjour';
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
      messageEl.style.display = 'block';
    }

    function hideMessage() {
      messageEl.style.display = 'none';
    }

    // ====================== NOTIFICATIONS ======================
    async function requestNotifPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    function checkTodayNotifications() {
      if (Notification.permission !== 'granted') return;
      const todayStr = new Date().toDateString();

      reminders.forEach(r => {
        const eventDate = new Date(r.event_at);
        if (eventDate.toDateString() === todayStr) {
          const key = 'notif_' + r.id + '_' + todayStr;
          if (!localStorage.getItem(key)) {
            new Notification('ZenRemind – Aujourd\'hui', {
              body: r.title,
              icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827370.png'
            });
            localStorage.setItem(key, '1');
          }
        }
      });
    }

    setInterval(checkTodayNotifications, 120000);

    // ====================== REMINDERS ======================
    async function loadReminders() {
      loadingEl.style.display = 'block';
      emptyEl.style.display = 'none';
      listEl.innerHTML = '';

      const { data, error } = await client
        .from('reminders')
        .select('*')
        .eq('completed', false)
        .order('event_at', { ascending: true });

      loadingEl.style.display = 'none';

      if (error) {
        console.error(error);
        return;
      }

      reminders = data || [];
      renderReminders();
      checkTodayNotifications();
    }

    function renderReminders() {
      listEl.innerHTML = '';

      if (reminders.length === 0) {
        emptyEl.style.display = 'block';
        document.getElementById('stat-today').textContent = '0';
        document.getElementById('stat-total').textContent = '0';
        return;
      }

      emptyEl.style.display = 'none';

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const afterTomorrow = new Date(tomorrow);
      afterTomorrow.setDate(afterTomorrow.getDate() + 1);
      const nextWeek = new Date(today);
      nextWeek.setDate(nextWeek.getDate() + 7);

      const groups = { today: [], tomorrow: [], week: [], later: [] };

      reminders.forEach(r => {
        const d = new Date(r.event_at);
        if (d >= today && d < tomorrow) groups.today.push(r);
        else if (d >= tomorrow && d < afterTomorrow) groups.tomorrow.push(r);
        else if (d < nextWeek) groups.week.push(r);
        else groups.later.push(r);
      });

      document.getElementById('stat-today').textContent = groups.today.length;
      document.getElementById('stat-total').textContent = reminders.length;

      const sections = [
        { key: 'today', label: "Aujourd'hui" },
        { key: 'tomorrow', label: 'Demain' },
        { key: 'week', label: 'Cette semaine' },
        { key: 'later', label: 'Plus tard' }
      ];

      sections.forEach(section => {
        const items = groups[section.key];
        if (items.length === 0) return;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';
        groupDiv.innerHTML = `<div class="group-title">${section.label}</div>`;

        items.forEach(r => {
          const isToday = section.key === 'today';
          const card = document.createElement('div');
          card.className = 'card' + (isToday ? ' today' : '');

          let badges = '';
          if (isToday) badges += '<span class="badge">Aujourd\'hui</span>';
          if (r.is_recurring) badges += ' <span class="badge weekly">Hebdo</span>';

          card.innerHTML = `
            <div class="card-header">
              <div>
                <div class="card-title">${escapeHtml(r.title)}</div>
                <div class="card-meta">${formatDate(r.event_at)} · ${formatTime(r.event_at)}</div>
              </div>
              <div>${badges}</div>
            </div>
            ${r.notes ? `<div class="card-notes">${escapeHtml(r.notes)}</div>` : ''}
            <div class="card-actions">
              <button class="icon-btn done" title="Terminé" data-id="${r.id}">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
              </button>
              <button class="icon-btn delete" title="Supprimer" data-id="${r.id}">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          `;
          groupDiv.appendChild(card);
        });

        listEl.appendChild(groupDiv);
      });

      document.querySelectorAll('.icon-btn.done').forEach(btn => {
        btn.addEventListener('click', () => completeReminder(btn.dataset.id));
      });
      document.querySelectorAll('.icon-btn.delete').forEach(btn => {
        btn.addEventListener('click', () => deleteReminder(btn.dataset.id));
      });
    }

    reminderForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const notes = document.getElementById('notes').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const recurrence = document.getElementById('recurrence').value;

      if (!title || !date || !time) return;

      createBtn.disabled = true;
      createBtn.textContent = 'Ajout...';

      const eventAt = new Date(date + 'T' + time + ':00').toISOString();

      const payload = {
        title,
        notes: notes || null,
        event_at: eventAt,
        is_recurring: recurrence === 'weekly',
        recurrence_type: recurrence,
        user_id: currentUser.id
      };

      try {
        const { error } = await client.from('reminders').insert(payload);
        if (error) throw error;

        if (recurrence === 'weekly') {
          const baseDate = new Date(date + 'T' + time + ':00');
          for (let i = 1; i <= 4; i++) {
            const next = new Date(baseDate);
            next.setDate(next.getDate() + (7 * i));
            await client.from('reminders').insert({
              ...payload,
              event_at: next.toISOString()
            });
          }
        }

        reminderForm.reset();
        setDefaultDateTime();
        await loadReminders();
      } catch (err) {
        alert('Erreur : ' + err.message);
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = 'Ajouter';
      }
    });

    async function completeReminder(id) {
      await client.from('reminders').update({ completed: true }).eq('id', id);
      loadReminders();
    }

    async function deleteReminder(id) {
      if (!confirm('Supprimer ce rappel ?')) return;
      await client.from('reminders').delete().eq('id', id);
      loadReminders();
    }

    // ====================== UTILS ======================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function setDefaultDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 30);
      document.getElementById('date').value = now.toISOString().slice(0, 10);
      document.getElementById('time').value = now.toTimeString().slice(0, 5);
    }

    // ====================== INIT ======================
    setDefaultDateTime();

    client.auth.getSession().then(({ data: { session } }) => {
      if (session && session.user) {
        currentUser = session.user;
        showApp();
        loadReminders();
        requestNotifPermission();
      }
    });
  </script>
</body>
</html>
